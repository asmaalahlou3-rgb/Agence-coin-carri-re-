<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Carrière - Recrutement Immobilier</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #0c2b42;
            line-height: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .hero {
            width: 100%;
            max-width: 550px;
            padding: 2rem;
            text-align: center;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(12, 43, 66, 0.06);
        }
        .hero-logo {
            max-width: 160px;
            margin-bottom: 1.2rem;
        }
        .hero h1 {
            font-size: 1.6rem;
            color: #0c2b42;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }
        .hero p {
            font-size: 0.95rem;
            color: #2b4c6f;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }
        .cta-button {
            display: inline-block;
            background-color: #0c2b42;
            color: #ffffff;
            padding: 0.75rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }
        .cta-button:hover {
            background-color: #16405d;
        }
        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <section class="hero">
        <img src="LOGO.png" alt="Coin Carrière" class="hero-logo">
        <h1>La Référence du Recrutement Immobilier</h1>
        <p>Connectez-vous aux meilleurs talents et opportunités de premier plan à Casablanca, Rabat, Marrakech et Fès.</p>
        <a href="#" class="cta-button">Déposer mon profil</a>
        <p class="footer-text">© 2026 Coin Carrière. Tous droits réservés.</p>
    </section>

</body>
</html>
