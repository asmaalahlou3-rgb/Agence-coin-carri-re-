<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Carrière - Recrutement Immobilier</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #0c2b42;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .page-container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(12, 43, 66, 0.05);
            text-align: center;
        }
        .logo-container {
            margin-bottom: 1.5rem;
        }
        .logo {
            max-width: 160px;
            height: auto;
        }
        .title {
            font-size: 1.65rem;
            font-weight: 700;
            color: #0c2b42;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }
        .description {
            font-size: 0.95rem;
            color: #16405d;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .cta-btn {
            display: inline-block;
            width: 100%;
            max-width: 320px;
            background-color: #0c2b42;
            color: #ffffff;
            padding: 0.85rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(12, 43, 66, 0.15);
        }
        .cta-btn:hover {
            background-color: #16405d;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="logo-container">
            <img src="LOGO.png" alt="Coin Carrière" class="logo">
        </div>
        <h1 class="title">La Référence du Recrutement Immobilier</h1>
        <p class="description">Connectez-vous aux meilleurs talents et opportunités de premier plan à Casablanca, Rabat, Marrakech et Fès.</p>
        <a href="#" class="cta-btn">Déposer mon profil</a>
        <div class="footer">
            &copy; 2026 Coin Carrière. Tous droits réservés.
        </div>
    </div>

</body>
</html>
