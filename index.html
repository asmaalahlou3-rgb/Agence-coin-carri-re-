<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Carrière</title>
    <style>
        /* Reset de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0F172A;
            color: #FFFFFF;
        }

        /* Section Hero */
        .hero-section {
            background-color: #0F172A; /* Fond bleu foncé */
            color: #FFFFFF; /* Texte blanc */
            padding: 120px 20px;
            text-align: center;
            border-bottom: 3px solid #2563EB; /* Bordure bleue */
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-section h1 {
            color: #FFFFFF; /* Titre blanc */
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-section p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #E2E8F0; /* Blanc cassé / Gris très clair */
            margin-bottom: 40px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: #2563EB; /* Bouton en bleu vif */
            color: #FFFFFF; /* Texte blanc */
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .btn-primary:hover {
            background-color: #1D4ED8; /* Bleu plus foncé au survol */
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #FFFFFF;
            border: 1px solid #2563EB; /* Bordure bleue */
            padding: 13px 34px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: rgba(37, 99, 235, 0.2);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 2.5rem;
            }
            .hero-section p {
                font-size: 1rem;
            }
            .hero-buttons {
                flex-direction: column;
                gap: 15px;
            }
            .btn-primary, .btn-secondary {
                width: 100%;
                max-width: 280px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-container">
            <h1>Coin Carrière</h1>
            <p>Le réseau d'excellence pour les talents de l'immobilier et de l'entreprise.</p>
            <div class="hero-buttons">
                <a href="#contact" class="btn-primary">Nous Rejoindre</a>
                <a href="#services" class="btn-secondary">En Savoir Plus</a>
            </div>
        </div>
    </section>

</body>
</html>
