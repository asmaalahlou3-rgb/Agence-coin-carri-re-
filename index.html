<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Carrière</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0A0A0A;
            color: #F8F9FA;
        }

        .hero-section {
            background-color: #0A0A0A;
            color: #F8F9FA;
            padding: 120px 20px;
            text-align: center;
            border-bottom: 2px solid #C5A059;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-section h1 {
            color: #C5A059;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-section p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #CCCCCC;
            margin-bottom: 40px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: #C5A059;
            color: #0A0A0A;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .btn-primary:hover {
            background-color: #D4B26F;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #F8F9FA;
            border: 1px solid #C5A059;
            padding: 13px 34px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: rgba(197, 160, 89, 0.1);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 2.5rem;
            }
            .hero-section p {
                font-size: 1rem;
            }
            .hero-buttons {
                flex-direction: column;
                gap: 15px;
            }
            .btn-primary, .btn-secondary {
                width: 100%;
                max-width: 280px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-container">
            <h1>Coin Carrière</h1>
            <p>Le réseau d'excellence pour les talents de l'immobilier et de l'entreprise au Maroc.</p>
            <div class="hero-buttons">
                <a href="#contact" class="btn-primary">Nous Rejoindre</a>
                <a href="#services" class="btn-secondary">En Savoir Plus</a>
            </div>
        </div>
    </section>

</body>
</html>
